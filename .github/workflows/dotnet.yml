# Build, format-check and test the solution.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # A hung test (a named pipe, an STA form) would otherwise hold the runner for six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from the tag history; a shallow clone has none.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The SDK band global.json pins, so CI builds with the SDK a release is built with.
          global-json-file: global.json

      # Restore downloads every package afresh otherwise. The key changes with any project file
      # (a package added or bumped) or the SDK; a miss falls back to the newest cache and restore
      # fetches only what changed.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install gettext
        shell: pwsh
        run: |
          # Straight from the gettext-iconv-windows release on GitHub, the build the Chocolatey
          # package wraps. Chocolatey's community feed has outages (503, 504), and during one
          # choco can exit 0 after installing nothing ("installed 0/0 packages"), so its exit code
          # proves nothing. The download is pinned by its SHA-256 (the release page lists it);
          # to update, change the tag, the file name and the hash together.
          $url = "https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-static-64.zip"
          $sha256 = "2B999BC37B56FA052FF98578E9CB188152009F634E3A66AA8FF263A016E9C466"
          $zip = Join-Path $env:RUNNER_TEMP "gettext.zip"
          $root = Join-Path $env:RUNNER_TEMP "gettext"
          for ($attempt = 1; ; $attempt++) {
              try {
                  Invoke-WebRequest -Uri $url -OutFile $zip
                  break
              } catch {
                  if ($attempt -ge 3) { throw "gettext download failed $attempt times: $_" }
                  Start-Sleep -Seconds (15 * $attempt)
              }
          }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "gettext.zip has SHA-256 $actual, expected $sha256" }
          Expand-Archive -Path $zip -DestinationPath $root
          # GITHUB_PATH is how a step hands PATH to the ones after it.
          $msgfmt = Join-Path $root "bin\msgfmt.exe"
          if (-not (Test-Path $msgfmt)) { throw "msgfmt.exe not found at $msgfmt" }
          Split-Path $msgfmt | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # MO files are build output and are gitignored, so a clean checkout has only the PO
      # sources. Without this the locale folders never reach the build output, and
      # Localization.GetCurrentCulture silently falls back to en-US for every language.
      - name: Compile translations
        shell: pwsh
        run: ./src/PlanCake/locale/scripts/Compile-Translations.ps1 -Strict

      - name: Restore dependencies
        run: dotnet restore

      - name: Check format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
