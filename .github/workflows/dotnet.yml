# Build, format-check and test the solution.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # A hung test (a named pipe, an STA form) would otherwise hold the runner for six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from the tag history; a shallow clone has none.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The SDK band global.json pins, so CI builds with the SDK a release is built with.
          global-json-file: global.json

      - name: Install gettext
        shell: pwsh
        run: |
          # The Chocolatey community feed has outages (504 Gateway Timeout), so retry before
          # giving up, and fail on choco's own exit code: otherwise the step carries on and dies
          # one line later with a misleading "msgfmt.exe not found". 1641 and 3010 are success
          # codes that ask for a reboot.
          for ($attempt = 1; ; $attempt++) {
              choco install gettext -y --no-progress
              if ($LASTEXITCODE -in 0, 1641, 3010) { break }
              if ($attempt -ge 3) { throw "choco install gettext failed $attempt times (exit code $LASTEXITCODE)" }
              Start-Sleep -Seconds (30 * $attempt)
          }
          # The package deploys to C:\Program Files\gettext-iconv and edits the machine PATH,
          # which the next step does not inherit: the runner captured its environment before the
          # install ran. GITHUB_PATH is how a step hands PATH to the ones after it. Locate the
          # binary rather than assuming the layout, and fail here if the package ever moves it.
          # Test-Path first: given a missing -Path, Get-ChildItem -Recurse searches the parent
          # folder for that name instead, and crawls all of Program Files for a quarter of an hour.
          $root = "C:\Program Files\gettext-iconv"
          if (-not (Test-Path $root)) { throw "gettext installed, but $root does not exist" }
          $msgfmt = Get-ChildItem -Path $root -Filter msgfmt.exe -Recurse | Select-Object -First 1
          if (-not $msgfmt) { throw "msgfmt.exe not found under $root" }
          $msgfmt.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # MO files are build output and are gitignored, so a clean checkout has only the PO
      # sources. Without this the locale folders never reach the build output, and
      # Localization.GetCurrentCulture silently falls back to en-US for every language.
      - name: Compile translations
        shell: pwsh
        run: ./src/PlanCake/locale/scripts/Compile-Translations.ps1 -Strict

      - name: Restore dependencies
        run: dotnet restore

      - name: Check format
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
