# Build, format-check and test the solution.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from the tag history; a shallow clone has none.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install gettext
        shell: pwsh
        run: |
          choco install gettext -y --no-progress
          # The package deploys to C:\Program Files\gettext-iconv and edits the machine PATH,
          # which the next step does not inherit: the runner captured its environment before the
          # install ran. GITHUB_PATH is how a step hands PATH to the ones after it. Locate the
          # binary rather than assuming the layout, and fail here if the package ever moves it.
          $msgfmt = Get-ChildItem -Path "C:\Program Files\gettext-iconv" -Filter msgfmt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msgfmt) { throw "msgfmt.exe not found after installing gettext" }
          $msgfmt.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # MO files are build output and are gitignored, so a clean checkout has only the PO
      # sources. Without this the locale folders never reach the build output, and
      # Localization.GetCurrentCulture silently falls back to en-US for every language.
      - name: Compile translations
        shell: pwsh
        run: ./src/PlanCake/locale/scripts/Compile-Translations.ps1 -Strict

      - name: Restore dependencies
        run: dotnet restore

      - name: Check format
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults

      # Coverlet writes a Cobertura report; its totals and a line per namespace go to the job log
      # and the step summary. The report itself is not uploaded.
      - name: Coverage summary
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw "No coverage report was written" }
          [xml]$coverage = Get-Content -Raw -LiteralPath $report.FullName
          $percent = { param($covered, $valid) if ([int]$valid -eq 0) { "n/a" } else { "{0:N1}%" -f (100.0 * $covered / $valid) } }
          $root = $coverage.coverage
          $lines = "$(& $percent $root.'lines-covered' $root.'lines-valid') ($($root.'lines-covered') of $($root.'lines-valid'))"
          $branches = "$(& $percent $root.'branches-covered' $root.'branches-valid') ($($root.'branches-covered') of $($root.'branches-valid'))"
          $summary = @(
              "## Code coverage",
              "",
              "Lines: $lines. Branches: $branches.",
              "",
              "| Namespace | Lines | Branches |",
              "| --- | --- | --- |"
          )
          $coverage.SelectNodes("//class") |
              Group-Object { $_.name -replace '\.[^.]+$', '' -replace '[+/<].*$', '' } |
              Sort-Object Name |
              ForEach-Object {
                  $all = @($_.Group | ForEach-Object { $_.SelectNodes("lines/line") })
                  $hit = @($all | Where-Object { [int]$_.hits -gt 0 }).Count
                  $branchCovered = 0
                  $branchValid = 0
                  foreach ($line in $all | Where-Object { $_.branch -eq "True" }) {
                      if ($line.'condition-coverage' -match '\((\d+)/(\d+)\)') {
                          $branchCovered += [int]$Matches[1]
                          $branchValid += [int]$Matches[2]
                      }
                  }
                  $summary += "| $($_.Name) | $(& $percent $hit $all.Count) | $(& $percent $branchCovered $branchValid) |"
              }
          $summary | Write-Output
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
