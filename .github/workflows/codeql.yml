# Static security analysis with CodeQL: the C# of the app and the tests, built the way the .NET
# workflow builds them, and the page's JavaScript (src/PlanCake/web). Results go to the
# repository's Security tab; nothing is uploaded as an artifact.

name: CodeQL

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion derives the version from the tag history; a shallow clone has none.
          fetch-depth: 0

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The same build as the .NET workflow, without the translations: CodeQL reads the C#, and
      # the .mo catalogs only matter at run time.
      - name: Build
        if: matrix.language == 'csharp'
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
